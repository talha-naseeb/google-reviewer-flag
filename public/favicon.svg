  <!-- Flag Banner -->
  <path d="M25 21H42C43.5 21 44.2 22.8 43.1 23.9L38.5 27L43.1 30.1C44.2 31.2 43.5 33 42 33H25V21Z" fill="url(#flagGrad)" />

  <!-- Accent Star -->
  <polygon points="32,23 33.2,25.8 36.2,25.9 33.8,27.7 34.8,30.6 32,28.8 29.2,30.6 30.2,27.7 27.8,25.9 30.8,25.8" fill="#E11D48" />
